{% extends "base.html" %}

{% block title %}Send Message{% endblock %}

{% block content %}
    <h2>Send Message</h2>
    {% if message_status %}
        <p class="message success">{{ message_status }}</p>
    {% endif %}
    <form method="POST">
        <label for="message">Message:</label>
        <input type="text" id="message" name="message" required>
        <input type="submit" value="Send">
    </form>
{% endblock %}
