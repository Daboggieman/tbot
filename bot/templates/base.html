<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MT5 Bot - {% block title %}{% endblock %}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: var(--tg-theme-bg-color, #f8f9fa); /* Fallback to light gray */
            color: var(--tg-theme-text-color, #212529); /* Fallback to dark gray */
        }
        .navbar {
            background-color: var(--tg-theme-button-color, #343a40) !important; /* Use button color for navbar */
        }
        .navbar-brand, .nav-link, .navbar-text {
            color: var(--tg-theme-button-text-color, #f8f9fa) !important;
        }
        /* Add more styles to use theme variables as needed */
    </style>
</head>
<body>
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">MT5 Trading Bot</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/" onclick="triggerHapticFeedback('light')">Dashboard</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/status" onclick="triggerHapticFeedback('light')">Status Page</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/send_message" onclick="triggerHapticFeedback('light')">Send Message</a>
                    </li>
                </ul>
                <ul class="navbar-nav">
                    {% if username %}
                        <li class="nav-item">
                            <span class="navbar-text me-2">Logged in as: {{ username }}</span>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/logout">Logout</a>
                        </li>
                    {% else %}
                        <li class="nav-item">
                            <a class="nav-link" href="/login">Login</a>
                        </li>
                    {% endif %}
                </ul>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script>
        let tg = window.Telegram.WebApp;
        tg.ready(); // Inform Telegram that the Web App is ready
        tg.expand(); // Force Web App to expand to full height



        // Apply Telegram theme colors to CSS variables
        document.documentElement.style.setProperty('--tg-theme-bg-color', tg.themeParams.bg_color);
        document.documentElement.style.setProperty('--tg-theme-text-color', tg.themeParams.text_color);
        document.documentElement.style.setProperty('--tg-theme-hint-color', tg.themeParams.hint_color);
        document.documentElement.style.setProperty('--tg-theme-link-color', tg.themeParams.link_color);
        document.documentElement.style.setProperty('--tg-theme-button-color', tg.themeParams.button_color);
        document.documentElement.style.setProperty('--tg-theme-button-text-color', tg.themeParams.button_text_color);

        // Set Web App header color
        tg.setHeaderColor(tg.themeParams.header_bg_color || tg.themeParams.bg_color);

        // Function to trigger haptic feedback
        function triggerHapticFeedback(type = 'light') {
            if (tg.HapticFeedback) {
                switch(type) {
                    case 'light':
                        tg.HapticFeedback.impactOccurred('light');
                        break;
                    case 'medium':
                        tg.HapticFeedback.impactOccurred('medium');
                        break;
                    case 'heavy':
                        tg.HapticFeedback.impactOccurred('heavy');
                        break;
                    case 'success':
                        tg.HapticFeedback.notificationOccurred('success');
                        break;
                    case 'warning':
                        tg.HapticFeedback.notificationOccurred('warning');
                        break;
                    case 'error':
                        tg.HapticFeedback.notificationOccurred('error');
                        break;
                    default:
                        // No default haptic feedback
                }
            }
        }
    </script>
</body>
</html>
